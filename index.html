<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Speed Calculator</title>
  <meta name="description" content="Calculate how long it takes to download any file. Simple, fast, and accurate." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>

    <header>
      <h1>Download Calculator</h1>
      <p>How long will your download take?</p>
    </header>

    <section class="card" aria-label="Download Time Calculator">

      <div class="field-row">
        <div class="field">
          <label for="file-size-value">File Size</label>
          <div class="input-wrap">
            <input type="number" id="file-size-value" placeholder="e.g. 10" min="0" step="any" autocomplete="off" />
            <select id="file-size-unit" aria-label="File size unit">
              <option value="B">B</option>
              <option value="KB">KB</option>
              <option value="MB">MB</option>
              <option value="GB" selected>GB</option>
              <option value="TB">TB</option>
              <option value="bit">bit</option>
              <option value="Kbit">Kbit</option>
              <option value="Mbit">Mbit</option>
              <option value="Gbit">Gbit</option>
              <option value="KiB">KiB</option>
              <option value="MiB">MiB</option>
              <option value="GiB">GiB</option>
            </select>
          </div>
          <span class="hint" id="size-hint"></span>
        </div>

        <div class="field">
          <label for="speed-value">Download Speed</label>
          <div class="input-wrap">
            <input type="number" id="speed-value" placeholder="e.g. 100" min="0" step="any" autocomplete="off" />
            <select id="speed-unit" aria-label="Speed unit">
              <option value="bps">bps</option>
              <option value="Kbps">Kbps</option>
              <option value="Mbps" selected>Mbps</option>
              <option value="Gbps">Gbps</option>
              <option value="Bps">B/s</option>
              <option value="KBps">KB/s</option>
              <option value="MBps">MB/s</option>
              <option value="GBps">GB/s</option>
            </select>
          </div>
          <span class="hint" id="speed-hint"></span>
        </div>
      </div>

      <button id="calc-btn" onclick="calculate()">Calculate</button>

    </section>

    <!-- Result -->
    <section class="result-panel" id="result-panel" aria-live="polite">
      <div class="result-time" id="result-time">—</div>
      <div class="result-sub" id="result-sub"></div>

      <div class="breakdown" id="breakdown">
        <div class="bd-item">
          <span class="bd-val" id="bd-sec">—</span>
          <span class="bd-label">seconds</span>
        </div>
        <div class="bd-item">
          <span class="bd-val" id="bd-min">—</span>
          <span class="bd-label">minutes</span>
        </div>
        <div class="bd-item">
          <span class="bd-val" id="bd-hr">—</span>
          <span class="bd-label">hours</span>
        </div>
        <div class="bd-item">
          <span class="bd-val" id="bd-day">—</span>
          <span class="bd-label">days</span>
        </div>
      </div>
    </section>

    <!-- Presets -->
    <section class="presets" aria-label="Quick presets">
      <h2>Quick presets</h2>
      <div class="presets-grid" id="presets-grid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
